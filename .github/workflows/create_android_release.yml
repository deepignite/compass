name: Build Android APK and Create Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version number, without the v prefix"
                required: true
                type: string

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ inputs.version }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java Development Kit (JDK)
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Ensure Assets Directory & File Exist
              run: |
                  mkdir -p assets
                  touch assets/compass.png

            - name: Install dependencies
              run: flutter pub get

            - name: Build ARM64-v8a APK
              run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

            - name: Prepare APK Output Name
              run: |
                  cp build/app/outputs/flutter-apk/app-release.apk "deepignite_compass-v${VERSION}.apk"

            - name: Create Release and Upload APK
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.VERSION }}
                  files: deepignite_compass-v${{ env.VERSION }}.apk
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
