name: Build Android APK and Create Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version number, without the v prefix"
                required: true
                type: string

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ inputs.version }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Java Development Kit (JDK)
              uses: actions/setup-java@v6
              with:
                  distribution: "zulu"
                  java-version: "25"
            - name: Set up Flutter
              uses: subosito/flutter-action@v2.23.0
              with:
                  channel: "stable"
                  cache: true

            - name: Decode Keystore
              run: |
                  echo "${{ secrets.JAVA_KEYSTORE }}" | base64 --decode > release.jks

            - name: Create key.properties
              run: |
                  cat <<EOF > android/key.properties
                  storePassword=${{ secrets.KEYSTORE_PASSWORD }}
                  keyPassword=${{ secrets.KEY_PASSWORD }}
                  keyAlias=${{ secrets.KEY_ALIAS }}
                  storeFile=release.jks
                  EOF

            - name: Install dependencies
              run: flutter pub get

            - name: Force fix for flutter_inappwebview
              run: |
                  echo -e "\ndependency_overrides:\n  flutter_inappwebview_android: ^1.1.4" >> pubspec.yaml
                  cat pubspec.yaml # Optional: prints the file to logs to verify it worked

            - name: Build ARM64-v8a APK
              run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

            - name: Prepare APK Output Name
              run: |
                  cp build/app/outputs/flutter-apk/app-release.apk "deepignite_compass-v${VERSION}.apk"

            - name: Create Release and Upload APK
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.VERSION }}
                  files: deepignite_compass-v${{ env.VERSION }}.apk
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
