name: Build Android APK and Create Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version number, without the v prefix"
                required: true
                type: string

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ inputs.version }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Java Development Kit (JDK)
              uses: actions/setup-java@v6
              with:
                  distribution: "temurin"
                  java-version: "17"
            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Decode Keystore
              run: |
                  echo "${{ secrets.JAVA_KEYSTORE }}" | base64 --decode > android/app/release.jks

            - name: Create key.properties
              run: |
                  cat <<EOF > android/key.properties
                  storePassword=${{ secrets.KEYSTORE_PASSWORD }}
                  keyPassword=${{ secrets.KEY_PASSWORD }}
                  keyAlias=${{ secrets.KEY_ALIAS }}
                  storeFile=release.jks
                  EOF

            - name: Install dependencies and clean
              run: |
                  flutter clean
                  flutter pub get

            - name: Patch flutter_inappwebview_android ProGuard reference
              run: |
                  find /home/runner/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3 -name "build.gradle" -exec sed -i "s/'proguard-android.txt'/'proguard-android-optimize.txt'/g" {} +

            - name: Build ARM64-v8a APK
              run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

            - name: Prepare APK Output Name
              run: |
                  cp android/app/build/outputs/flutter-apk/app-release.apk "deepignite_compass-v${VERSION}.apk"

            - name: Create Release and Upload APK
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.VERSION }}
                  files: deepignite_compass-v${{ env.VERSION }}.apk
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
