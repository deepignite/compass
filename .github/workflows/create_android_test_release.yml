name: Build Test Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.JAVA_KEYSTORE }}" | base64 --decode > release.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Run pub get
        run: |
          flutter pub get

      - name: Force fix for flutter_inappwebview
        run: |
          echo -e "\ndependency_overrides:\n  flutter_inappwebview_android: ^1.1.4" >> pubspec.yaml
          cat pubspec.yaml # Optional: prints the file to logs to verify it worked

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1 # Automatically deletes after 1 day
