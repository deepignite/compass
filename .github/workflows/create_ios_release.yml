name: Build Unsigned iOS IPA and Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup iOS Podfile and Set Deployment Target
        run: |
          if [ ! -f ios/Podfile ]; then
            cd ios && pod init && cd ..
          fi
          sed -i '' 's/# platform :ios, .*/platform :ios, '\''14.0'\''/' ios/Podfile
          sed -i '' 's/platform :ios, .*/platform :ios, '\''14.0'\''/' ios/Podfile

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install

      - name: Build Xcode Archive (Unsigned ARM64/ARM64e)
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            ARCHS="arm64 arm64e" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package into .ipa
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r deepignite_compass-v0.1.0.ipa Payload

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: build/ios/deepignite_compass-v0.1.0.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
