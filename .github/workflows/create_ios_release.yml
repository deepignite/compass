name: Build Unsigned iOS IPA and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Assets Exist
        run: |
          mkdir -p assets
          touch assets/compass.png

      - name: Install dependencies
        run: flutter pub get

      - name: Create Podfile with iOS 14 Target
        run: |
          mkdir -p ios
          cat << 'EOF' > ios/Podfile
          platform :ios, '14.0'

          target 'Runner' do
            use_frameworks!
            use_modular_headers!
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
          end
          EOF

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build Xcode Archive (Unsigned Standard ARM64)
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package into .ipa
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r deepignite_compass-v0.1.0.ipa Payload

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: build/ios/deepignite_compass-v0.1.0.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
